version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-LmsDb}
      MYSQL_USER: ${MYSQL_USER:-lmsuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lmspassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lms_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Connection String (MySQL format for Pomelo)
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Server=mysql;Database=LmsDb;User=lmsuser;Password=lmspassword;Port=3306;AllowUserVariables=True;Convert Zero Datetime=True}
      
      # JWT Configuration
      Jwt__Key: ${Jwt__Key:-HjhbaxbsajkUJHIU898U98!HuihuhHSuhW#2@2huhuihshdusabcuasbc}
      Jwt__Issuer: ${Jwt__Issuer:-LMS.API}
      Jwt__Audience: ${Jwt__Audience:-LMS.API}
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes:-60}
      
      # Supported Cultures (comma-separated)
      SupportedCultures: ${SupportedCultures:-en,az,tr,ru}
      
      # ASP.NET Core Configuration
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      
      # MySQL Connection
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      
      # Redis Connection (optional)
      Redis__ConnectionString: ${Redis__ConnectionString:-redis:6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Wait for MySQL to be fully ready before starting
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for MySQL to be ready..."
        for i in $$(seq 1 30); do
          if mysqladmin ping -h mysql -u lmsuser -plmspassword --silent 2>/dev/null; then
            echo "MySQL is ready!"
            break
          fi
          echo "MySQL is unavailable - attempt $$i/30 - waiting 2 seconds..."
          sleep 2
        done
        echo "Starting application..."
        exec dotnet LMS.API.dll
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "dotnet", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  lms_network:
    driver: bridge

